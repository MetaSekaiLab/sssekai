name: Publish

on:
  workflow_dispatch:
    inputs:
      release_pypi:
        description: 'Publish to PyPI'
        type: boolean
        default: true
      release_github:
        description: 'Build and release Windows executables'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: inputs.release_pypi || inputs.release_github
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install build twine pytest
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check --strict dist/*
      - name: Install wheel
        shell: pwsh
        run: python -m pip install (Get-Item dist/*.whl).FullName
      - name: Test
        run: python -m pytest -v
      - name: Check installed command
        working-directory: ${{ runner.temp }}
        run: sssekai --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: inputs.release_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sssekai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release-windows:
    if: inputs.release_github
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyinstaller ".[gui,il2cpp]"
      - name: Build Windows executables
        run: |
          pyinstaller sssekai.spec
          pyinstaller sssekai-gui.spec
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sssekai; print(sssekai.__version__)"
          gh release create $version dist/sssekai.exe dist/sssekai-gui.exe --target "${{ github.sha }}" --title "Version $version" --generate-notes
